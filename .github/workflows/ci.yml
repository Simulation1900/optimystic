name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://planner:planner@localhost:5432/planner_test
      DATABASE_URL_E2E: postgres://planner:planner@localhost:5432/planner_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests (core rules and API against PostgreSQL)
        run: pnpm test
      - name: Build
        run: pnpm --filter @optimystic/web build && pnpm --filter @optimystic/api build
      - name: Prepare the end-to-end database
        # the app creates its tables when it starts (Playwright starts it)
        run: PGPASSWORD=planner psql -h localhost -U planner -d planner_test -c 'CREATE DATABASE planner_e2e'
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (iPhone and laptop sizes)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    # A new x86 image for every release tag, built only when the tests pass.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
